camel.main.name = camel-jev-routing

# camel-typesafe-ai is new in 4.23.0, so this needs a snapshot until 4.23.0 is released.
# Apache snapshots for camel-typesafe-ai, Sonatype snapshots for the LangChain4j decision API.
camel.jbang.camel-version = 4.23.0-SNAPSHOT
camel.jbang.repos = https://repository.apache.org/content/groups/snapshots,https://central.sonatype.com/repository/maven-snapshots/

# camel-semantic (preview) is the provider-independent semantic language; camel-typesafe-ai is
# the provider adapter it discovers on the classpath. The langchain4j artifacts are for the bean
# variant (TriageDecisions.java): the decision API is experimental, 1.21.0 snapshots.
camel.jbang.dependencies = org.apache.camel:camel-semantic:4.23.0-SNAPSHOT,org.apache.camel:camel-typesafe-ai:4.23.0-SNAPSHOT,dev.langchain4j:langchain4j:1.21.0-SNAPSHOT,dev.langchain4j:langchain4j-typesafe:1.21.0-beta31-SNAPSHOT

# Decision backend, shared by both routes. Default is tev1 on Ollama, which serves the
# System One protocol (POST /v1/systemone) natively since Ollama 0.35:
#   ollama pull tev1:4b
# baseUrl excludes /v1/systemone, both clients append it. Ollama ignores the api key.
typesafe.base-url = http://127.0.0.1:11434
typesafe.model = tev1:4b
# apiKey is a secret option; going through a placeholder keeps Camel's security warning quiet.
# "ollama" is a dummy, Ollama ignores auth. For a real backend point this at a vault or env var.
typesafe.api-key = ollama

camel.component.typesafe-ai.base-url = {{typesafe.base-url}}
camel.component.typesafe-ai.model = {{typesafe.model}}
camel.component.typesafe-ai.api-key = {{typesafe.api-key}}

# To use TypeSafe AI Jev instead (needs early access), swap and re-measure the threshold:
#   typesafe.base-url = https://api.typesafe.ai
#   typesafe.model = jev-latest
#   typesafe.api-key = {{env:TYPESAFE_API_KEY}}

# The human-review gate is the actionable noul question, checked in each route at 0.5.
# Measured against tev1:4b on Ollama: small talk reads 0.004 and below, real tickets 0.69 and up,
# so the natural 0.5 needs no tuning. The choice confidence is logged but not gated on: batching
# several questions shifts it (hello reads technical at 0.9), while the noul stays stable.
