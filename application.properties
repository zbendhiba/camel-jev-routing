camel.main.name = camel-jev-routing

# camel-typesafe-ai is new in 4.23.0, so this needs a snapshot until 4.23.0 is released.
# Apache snapshots for camel-typesafe-ai, Sonatype snapshots for the LangChain4j decision API.
camel.jbang.camel-version = 4.23.0-SNAPSHOT
camel.jbang.repos = https://repository.apache.org/content/groups/snapshots,https://central.sonatype.com/repository/maven-snapshots/

# For the LangChain4j bean variant (TriageDecisions.java + ticket-routing-l4j.camel.yaml).
# The decision API is experimental and unreleased: langchain4j 1.21.0 snapshots.
camel.jbang.dependencies = dev.langchain4j:langchain4j:1.21.0-SNAPSHOT,dev.langchain4j:langchain4j-typesafe:1.21.0-beta31-SNAPSHOT

# Decision backend, shared by both routes. Default is tev1 on Ollama, which serves the
# System One protocol (POST /v1/systemone) natively since Ollama 0.35:
#   ollama pull tev1:4b
# baseUrl excludes /v1/systemone, both clients append it. Ollama ignores the api key.
typesafe.base-url = http://127.0.0.1:11434
typesafe.model = tev1:4b
# apiKey is a secret option; going through a placeholder keeps Camel's security warning quiet.
# "ollama" is a dummy, Ollama ignores auth. For a real backend point this at a vault or env var.
typesafe.api-key = ollama

camel.component.typesafe-ai.base-url = {{typesafe.base-url}}
camel.component.typesafe-ai.model = {{typesafe.model}}
camel.component.typesafe-ai.api-key = {{typesafe.api-key}}

# To use TypeSafe AI Jev instead (needs early access), swap and re-measure the threshold:
#   typesafe.base-url = https://api.typesafe.ai
#   typesafe.model = jev-latest
#   typesafe.api-key = {{env:TYPESAFE_API_KEY}}

# The questions the model answers, and what it sees as state.
# resultProperty keeps the ticket text as the message body.
camel.component.typesafe-ai.questions-resource = file:triage-questions.json
# bodyAs(String), not body: platform-http hands over a stream-cached body and the component
# only accepts a string, map or list as state.
camel.component.typesafe-ai.state = ${bodyAs(String)}
camel.component.typesafe-ai.result-property = evaluation

# Route to human review below this confidence.
# confidence is 1 - normalized entropy, not the probability of the winning label.
# Measured against tev1:4b on Ollama. The two routes frame the state differently (the component
# sends the bare ticket text, the LangChain4j service sends {ticket: text}), so they calibrate
# differently: real tickets read 0.37+ on both, but small talk tops out at 0.077 through the
# component and 0.275 through the bean. 0.32 sits in both gaps.
# Re-measure if you change the criteria, the backend OR the client.
ticket.confidenceThreshold = 0.32
