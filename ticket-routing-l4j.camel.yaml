# The same triage as ticket-routing.camel.yaml, but the decision step is a LangChain4j
# decision service (TriageDecisions.java) called as a Camel bean. The three questions are a
# typed record instead of triage-questions.json, and the answers come back as YesNoAnswer,
# Choice and Scale objects on the body instead of an exchange property. Everything after the
# decision reuses the direct: department routes from departments.camel.yaml.

- beans:
    - name: triageDecisions
      type: TriageDecisions
      constructors:
        0: "{{typesafe.base-url}}"
        1: "{{typesafe.model}}"

- route:
    id: ticket-routing-l4j
    from:
      uri: platform-http:/ticket-l4j
      parameters:
        httpMethodRestrict: POST
      steps:
        # Same curl plumbing as the component route: put a form-parsed body back together.
        - choice:
            when:
              - expression:
                  simple:
                    expression: "${body} is 'java.util.Map'"
                steps:
                  - setBody:
                      expression:
                        simple:
                          expression: "${body.keySet().iterator().next()}"
                  - removeHeaders:
                      pattern: "*"
        # The bean replaces the body with the Assessment, so park the ticket text first.
        - setVariable:
            name: ticket
            expression:
              simple:
                expression: "${bodyAs(String)}"
        - bean:
            description: One assess() call answers all three questions
            ref: triageDecisions
            method: assess
        - setVariable:
            name: actionable
            expression:
              simple:
                expression: "${body.actionable.probability}"
        - setVariable:
            name: department
            expression:
              simple:
                expression: "${body.department.value.name.toLowerCase()}"
        - setVariable:
            name: confidence
            expression:
              simple:
                expression: "${body.department.confidence}"
        - setVariable:
            name: severity
            expression:
              simple:
                expression: "${body.severity.mean}"
        - log:
            message: "actionable=${variable.actionable} department=${variable.department} confidence=${variable.confidence} severity=${variable.severity}"
        - setBody:
            expression:
              simple:
                expression: "${variable.ticket}"
        # Not actionable? A human gets it, and the exchange stops here.
        - filter:
            expression:
              simple:
                expression: "${variable.actionable} < '0.5'"
            steps:
              - to:
                  uri: direct:human-review
              - stop: {}
        # The model names the route. Safe only because Choice<Department> is a closed enum:
        # every constant must have a matching direct: route, and nothing else can come back.
        - toD:
            uri: "direct:${variable.department}"
